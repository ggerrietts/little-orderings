services:
  init-user:
    build: .
    volumes:
      - app-data:/data
    environment:
      DATABASE_URL: sqlite:/data/todo.db
    entrypoint: >
      sh -c "
        ./little-orderings user create testuser test@localhost changeme || true
      "

  app:
    build: .
    ports:
      - "8080:3000"
    volumes:
      - app-data:/data
    environment:
      DATABASE_URL: sqlite:/data/todo.db
      SESSION_SECRET: changeme-use-a-real-secret
      HOST: 0.0.0.0
      PORT: "3000"
      ALLOWED_ORIGIN: http://localhost:8080
      RUST_LOG: info
    depends_on:
      init-user:
        condition: service_completed_successfully

volumes:
  app-data:
