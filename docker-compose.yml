services:
  app:
    build: .
    ports:
      - "8080:3000"
    volumes:
      - app-data:/data
    environment:
      DATABASE_URL: sqlite:/data/todo.db
      SESSION_SECRET: changeme-use-a-real-secret
      HOST: 0.0.0.0
      PORT: "3000"
      ALLOWED_ORIGIN: http://localhost:8080
      RUST_LOG: info
      # On first boot with an empty DB, seeds an admin user.
      # Remove after initial setup or leave unset to skip seeding.
      ADMIN_PASSWORD: changeme
      ADMIN_USER: admin
      ADMIN_EMAIL: admin@localhost

volumes:
  app-data:
